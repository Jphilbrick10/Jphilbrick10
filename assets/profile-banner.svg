<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Josh Philbrick — creator, systems thinker, and founder of Coherence Energy Labs</title>
  <desc id="desc">A dark technical banner with a luminous coherence network, the words Josh Philbrick, and the statement Building systems for questions most people are told are too large to ask.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.55" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#111d36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#76e4ff" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#5b8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76e4ff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#76e4ff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b8c7ff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="932" cy="168" rx="310" ry="250" fill="url(#glow)" filter="url(#soft)"/>

  <g fill="none" stroke="url(#line)" stroke-width="1.5">
    <path d="M690 80C770 24 844 24 922 86S1068 160 1158 92"/>
    <path d="M650 170C750 96 844 112 915 177S1061 255 1172 183"/>
    <path d="M698 270C790 212 853 218 934 276S1080 322 1168 272"/>
    <path d="M720 44L770 128L862 64L916 176L1002 102L1080 212L1158 138"/>
    <path d="M684 242L770 128L844 240L916 176L1008 278L1080 212L1170 300"/>
    <path d="M862 64L844 240M1002 102L1008 278M770 128L916 176L1080 212"/>
  </g>

  <g fill="#8de8ff" filter="url(#nodeGlow)">
    <circle cx="770" cy="128" r="4"/>
    <circle cx="862" cy="64" r="4"/>
    <circle cx="844" cy="240" r="4"/>
    <circle cx="916" cy="176" r="7"/>
    <circle cx="1002" cy="102" r="4"/>
    <circle cx="1008" cy="278" r="4"/>
    <circle cx="1080" cy="212" r="4"/>
    <circle cx="1158" cy="138" r="3"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="82" fill="#80e7ff" font-size="16" font-weight="700" letter-spacing="3.2">CREATOR  ·  SYSTEMS THINKER  ·  FOUNDER</text>
    <text x="68" y="154" fill="#ffffff" font-size="58" font-weight="780" letter-spacing="-1.8">JOSH PHILBRICK</text>
    <text x="72" y="205" fill="#c7d4ee" font-size="22" font-weight="430">Founder of Coherence Energy Labs</text>
    <text x="72" y="258" fill="#eef5ff" font-size="23" font-weight="560">Building systems for questions most people</text>
    <text x="72" y="290" fill="#eef5ff" font-size="23" font-weight="560">are told are too large to ask.</text>
    <text x="72" y="330" fill="#7f90ad" font-size="14" font-weight="500" letter-spacing="1.4">PHYSICS  ·  COMPUTATION  ·  BIOLOGY  ·  INTELLIGENCE</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#7fa7ff" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
